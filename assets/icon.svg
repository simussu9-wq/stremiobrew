<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a74ff"/><stop offset=".5" stop-color="#6a3ff0"/><stop offset="1" stop-color="#3b1fb4"/>
    </linearGradient>
    <radialGradient id="hi" cx=".3" cy=".18" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05e6c8"/><stop offset="1" stop-color="#009fcf"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a50f7"/><stop offset="1" stop-color="#4524c9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1a0b55" flood-opacity=".45"/></filter>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#tile)"/>
  <rect width="256" height="256" rx="58" fill="url(#hi)"/>
  <g filter="url(#sh)">
    <!-- handle -->
    <path d="M168 112 C204 106 214 126 212 146 C210 170 194 180 168 176" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round"/>
    <!-- body -->
    <path d="M52 92 L176 92 L172 196 C171 214 160 222 144 222 L84 222 C68 222 57 214 56 196 Z" fill="#fff"/>
    <!-- foam overflowing the rim -->
    <circle cx="66" cy="88" r="20" fill="#fff"/>
    <circle cx="96" cy="74" r="26" fill="#fff"/>
    <circle cx="132" cy="76" r="24" fill="#fff"/>
    <circle cx="162" cy="88" r="20" fill="#fff"/>
    <rect x="50" y="86" width="128" height="20" fill="#fff"/>
  </g>
  <!-- Stremio play, punched into the glass -->
  <path d="M96 128 L96 192 Q96 202 105 197 L152 168 Q160 163 152 158 L105 123 Q96 118 96 128 Z" fill="url(#play)"/>
  <!-- rising bubbles -->
  <circle cx="196" cy="62" r="13" fill="url(#teal)"/>
  <circle cx="214" cy="32" r="7" fill="#fff" opacity=".75"/>
  <circle cx="176" cy="40" r="5" fill="#fff" opacity=".55"/>
</svg>
